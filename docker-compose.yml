# ============================================================================
# MMU FleetRadar 3D — local/production dependencies
#   docker compose up -d
# ============================================================================
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mmu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mmu_fleet}
    ports:
      - '5432:5432'
    volumes:
      - mmu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mmu} -d ${POSTGRES_DB:-mmu_fleet}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mmu-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - mmu_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Application services. Build context is the repo root (see *_/Dockerfile).
  # Start just the data layer with:  docker compose up -d postgres redis
  # --------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mmu-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # Must be supplied (>= 32 chars) via a root .env or the shell.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: postgres://${POSTGRES_USER:-mmu}:${POSTGRES_PASSWORD:-mmu_secret}@postgres:5432/${POSTGRES_DB:-mmu_fleet}
      REDIS_URL: redis://redis:6379
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-false}
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_SAME_ORIGIN: 'true'
    container_name: mmu-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${CLIENT_PORT:-8080}:80'

volumes:
  mmu_pgdata:
  mmu_redisdata: