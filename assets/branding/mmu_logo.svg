<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="mmuRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21E26"/>
      <stop offset="100%" stop-color="#B71219"/>
    </linearGradient>
    <linearGradient id="mmuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Oval with gold border -->
    <ellipse cx="50" cy="50" rx="46" ry="46" fill="#FFFFFF" stroke="url(#mmuGoldGrad)" stroke-width="4" filter="url(#shadow)"/>
    <ellipse cx="50" cy="50" rx="40" ry="40" fill="url(#mmuRedGrad)"/>
    
    <!-- Sunburst / Rays -->
    <circle cx="50" cy="48" r="28" fill="#FBBF24" opacity="0.9"/>
    
    <!-- Lingam / Sacred Symbol Emblem -->
    <rect x="42" y="24" width="16" height="30" rx="8" fill="#1E293B"/>
    <ellipse cx="50" cy="27" rx="8" ry="4" fill="#334155"/>
    <!-- Sacred Markings -->
    <line x1="45" y1="34" x2="55" y2="34" stroke="#FBBF24" stroke-width="1.8"/>
    <line x1="45" y1="38" x2="55" y2="38" stroke="#FBBF24" stroke-width="1.8"/>
    <circle cx="50" cy="36" r="1.2" fill="#E21E26"/>

    <!-- Pedestal / Kalash Base -->
    <path d="M35 56 C35 52, 65 52, 65 56 L61 68 C61 72, 39 72, 39 68 Z" fill="url(#mmuGoldGrad)"/>
    
    <!-- Sanskrit Ribbon arc banner at bottom -->
    <path d="M12 78 Q50 96 88 78 L92 86 Q50 106 8 86 Z" fill="url(#mmuRedGrad)" stroke="#FBBF24" stroke-width="1"/>
    <text x="50" y="87" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" text-anchor="middle" letter-spacing="0.5">MM(DU) • 1993</text>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <!-- Main Title -->
    <text x="0" y="30" fill="#E21E26" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="30" letter-spacing="1">MAHARISHI</text>
    <text x="0" y="58" fill="#E21E26" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="0.8">MARKANDESHWAR</text>
    
    <!-- Subtitle Badge -->
    <rect x="0" y="66" width="310" height="18" rx="4" fill="#0D1B3E"/>
    <text x="8" y="79" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.6">DEEMED TO BE UNIVERSITY • NAAC A++ ACCREDITED</text>
    
    <!-- Campuses Location -->
    <text x="0" y="96" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" letter-spacing="0.4">Mullana (Ambala) • Sadopur • Solan | Estd. u/s 3 of UGC Act, 1956</text>
  </g>
</svg>
